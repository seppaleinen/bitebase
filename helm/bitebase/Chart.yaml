apiVersion: v2
name: bitebase
description: BiteBase — personalized AI micro-learning platform
type: application

# Chart version — bumped automatically by the helm-release workflow
version: 0.1.0

# appVersion tracks the Docker image tag deployed by this chart version.
# Set to the specific release tag (e.g. "v1.2.3") when pinning.
appVersion: "0.1.0"

keywords:
  - learning
  - ai
  - education

maintainers:
  - name: BiteBase

# Optional bundled PostgreSQL (bitnami). Enable via --set postgresql.enabled=true
# for dev/staging. Disable and point externalDatabase.url at a managed DB for prod.
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
