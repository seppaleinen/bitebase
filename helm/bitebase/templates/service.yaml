apiVersion: v1
kind: Service
metadata:
  name: {{ include "bitebase.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bitebase.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "bitebase.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
