{{- if not .Values.existingSecret -}}
{{/*
Chart-managed secret. Only created when existingSecret is not set.
WARNING: values are stored in the Helm release history. Use existingSecret
(populated by External Secrets Operator, Sealed Secrets, or Vault) in production.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bitebase.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bitebase.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ include "bitebase.postgresql.url" . | quote }}
  {{- else }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required when postgresql.enabled=false and existingSecret is not set" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  BETTER_AUTH_SECRET: {{ required "secrets.betterAuthSecret is required" .Values.secrets.betterAuthSecret | quote }}
  TAVILY_API_KEY: {{ .Values.secrets.tavilyApiKey | default "" | quote }}
{{- end }}
