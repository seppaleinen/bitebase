# ─────────────────────────────────────────────────────────────────────────────
# BiteBase secrets
#
# DO NOT commit real values. Populate via your secret management tool:
#   kubectl create secret generic bitebase-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=BETTER_AUTH_SECRET='...' \
#     --from-literal=TAVILY_API_KEY='tvly-...' \
#     -n bitebase
#
# Or use External Secrets Operator, Sealed Secrets, Vault, etc.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: bitebase-secrets
  namespace: bitebase
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres:5432/bitebase"
  BETTER_AUTH_SECRET: "CHANGE_ME_32_CHAR_HEX"
  TAVILY_API_KEY: ""
