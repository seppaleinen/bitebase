name: Publish Helm Chart & Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'helm/bitebase/**'
      - 'k8s/**'

# Only one publish at a time to avoid tag/push races
concurrency:
  group: publish-helm-chart
  cancel-in-progress: false

jobs:
  publish:
    name: Build images & push Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: write    # push version-bump commit + tag
      packages: write    # push OCI artifacts to GHCR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Install tools ──────────────────────────────────────────────────────
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Read chart metadata ───────────────────────────────────────────────
      - name: Read chart version and app version
        id: chart
        run: |
          echo "version=$(yq '.version' helm/bitebase/Chart.yaml)" >> "$GITHUB_OUTPUT"
          echo "app_version=$(yq '.appVersion' helm/bitebase/Chart.yaml)" >> "$GITHUB_OUTPUT"

      # ── Build & push Docker images ────────────────────────────────────────
      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/bitebase:${{ steps.chart.outputs.app_version }}
            ghcr.io/${{ github.repository_owner }}/bitebase:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bitebase:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bitebase:buildcache,mode=max

      - name: Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/bitebase-migrate:${{ steps.chart.outputs.app_version }}
            ghcr.io/${{ github.repository_owner }}/bitebase-migrate:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bitebase-migrate:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bitebase-migrate:buildcache,mode=max

      # ── Package & push Helm chart ──────────────────────────────────────────
      - name: Lint chart
        run: helm lint helm/bitebase

      - name: Package chart (with dependency update)
        run: |
          helm package helm/bitebase \
            --dependency-update \
            --version "${{ steps.chart.outputs.version }}" \
            --app-version "${{ steps.chart.outputs.app_version }}" \
            --destination /tmp/helm-packages

      - name: Log in to GHCR with Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push chart to GHCR
        run: |
          helm push \
            /tmp/helm-packages/bitebase-${{ steps.chart.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      # ── Bump chart version for next release ───────────────────────────────
      - name: Compute bump type
        id: bump_type
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -q "BREAKING CHANGE"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qiE "^feat(\(.+\))?:"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump chart version
        id: bump
        run: |
          CURRENT="${{ steps.chart.outputs.version }}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          case "${{ steps.bump_type.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumping chart: ${CURRENT} → ${NEW_VERSION}"

      - name: Write new version to Chart.yaml
        run: |
          yq -i ".version = \"${{ steps.bump.outputs.version }}\"" helm/bitebase/Chart.yaml

      # ── Commit version bump back to repo ──────────────────────────────────
      - name: Commit and push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/bitebase/Chart.yaml
          git commit -m "chore(helm): bump chart version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      # ── Tag the chart release ──────────────────────────────────────────────
      - name: Tag chart release
        run: |
          git tag "helm/bitebase-${{ steps.bump.outputs.version }}"
          git push origin "helm/bitebase-${{ steps.bump.outputs.version }}"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Chart:** \`ociregistry ghcr.io/\${{ github.repository_owner }}/charts/bitebase:${{ steps.chart.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Runner image:** \`ghcr.io/\${{ github.repository_owner }}/bitebase:${{ steps.chart.outputs.app_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Migrations image:** \`ghcr.io/\${{ github.repository_owner }}/bitebase-migrate:${{ steps.chart.outputs.app_version }}\`" >> "$GITHUB_STEP_SUMMARY"
