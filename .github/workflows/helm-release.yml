name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'

# Only one helm release at a time to avoid tag/push races
concurrency:
  group: helm-release
  cancel-in-progress: false

jobs:
  release:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: write    # push version-bump commit + tag
      packages: write    # push OCI artifact to GHCR

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and a token that can push back to the repo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Install tools ──────────────────────────────────────────────────────
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      # ── Compute new chart version ──────────────────────────────────────────
      - name: Read current chart version
        id: current
        run: |
          echo "version=$(yq '.version' helm/bitebase/Chart.yaml)" >> "$GITHUB_OUTPUT"

      # Bump rules (checked in commit message order, first match wins):
      #   BREAKING CHANGE  → major
      #   feat:            → minor
      #   everything else  → patch
      - name: Compute bump type
        id: bump_type
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -q "BREAKING CHANGE"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qiE "^feat(\(.+\))?:"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: bump
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          case "${{ steps.bump_type.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumping chart: ${CURRENT} → ${NEW_VERSION} (${BUMP_TYPE})"

      - name: Write new version to Chart.yaml
        run: |
          yq -i ".version = \"${{ steps.bump.outputs.version }}\"" helm/bitebase/Chart.yaml

      # ── Package ────────────────────────────────────────────────────────────
      - name: Add bitnami repo (for postgresql subchart)
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Update chart dependencies
        run: helm dependency update helm/bitebase

      - name: Lint chart
        run: helm lint helm/bitebase

      - name: Package chart
        run: |
          helm package helm/bitebase \
            --version "${{ steps.bump.outputs.version }}" \
            --app-version "${{ steps.bump.outputs.version }}" \
            --destination /tmp/helm-packages

      # ── Push to GHCR (OCI) ────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push chart to GHCR
        run: |
          helm push \
            /tmp/helm-packages/bitebase-${{ steps.bump.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}

      # ── Commit version bump back to repo ──────────────────────────────────
      # [skip ci] prevents this commit from re-triggering the workflow.
      - name: Commit and push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/bitebase/Chart.yaml
          git commit -m "chore(helm): bump chart version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      # ── Tag the chart release ──────────────────────────────────────────────
      - name: Tag chart release
        run: |
          git tag "helm/bitebase-${{ steps.bump.outputs.version }}"
          git push origin "helm/bitebase-${{ steps.bump.outputs.version }}"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print install command
        run: |
          echo "### Helm chart published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "# Add to your infrastructure repo:" >> "$GITHUB_STEP_SUMMARY"
          echo "helm install bitebase \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  oci://ghcr.io/${{ github.repository_owner }}/bitebase \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --version ${{ steps.bump.outputs.version }} \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -f values-prod.yaml" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
